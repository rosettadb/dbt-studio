name: Publish

on:
  push:
    branches:
      - main

env:
  # This will be set by the first job and used by all others
  RELEASE_TAG: ""

jobs:
  extract-version:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from package.json
        id: version
        run: |
          # Extract version from package.json
          VERSION=$(node -p "require('./package.json').version")
          echo "Extracted version: $VERSION"

          # Check if this is a pre-release version (contains alpha, beta, rc, etc.)
          SUFFIX=""
          if echo "$VERSION" | grep -q -E "(alpha|beta|rc)"; then
            # Extract the pre-release suffix
            if echo "$VERSION" | grep -q "alpha"; then
              SUFFIX="-alpha"
            elif echo "$VERSION" | grep -q "beta"; then
              SUFFIX="-beta"
            elif echo "$VERSION" | grep -q "rc"; then
              SUFFIX="-rc"
            fi
            # Remove the suffix from version for cleaner tag
            CLEAN_VERSION=$(echo "$VERSION" | sed -E 's/-(alpha|beta|rc).*//')
          else
            CLEAN_VERSION="$VERSION"
          fi

          RELEASE_TAG="${CLEAN_VERSION}${SUFFIX}"
          echo "Release tag: $RELEASE_TAG"

          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
  publish-mac-arm64:
    runs-on: macos-latest
    needs: extract-version
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: |
          npm install
          npm run postinstall

      - name: Build project
        run: npm run build

      - name: Build for macOS ARM64 (no publish yet)
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASS }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          npm exec electron-builder -- --publish never --mac --arm64

      - name: Find and filter ARM64 artifacts
        run: |
          BUILD_DIR="release/build"

          echo "Using build directory: $BUILD_DIR"

          if [ ! -d "$BUILD_DIR" ]; then
            echo "Error: Build directory $BUILD_DIR not found"
            echo "Current directory contents:"
            ls -la
            echo "Searching for build artifacts..."
            find . -name "*.dmg" -o -name "*.zip" | head -10
            exit 1
          fi

          cd "$BUILD_DIR"
          echo "Build directory contents:"
          ls -la

          # Remove all files that DON'T contain -arm64, but keep latest-mac.yml
          find . -name "*.dmg" ! -name "*-arm64*" -type f -delete
          find . -name "*.zip" ! -name "*-arm64*" -type f -delete
          find . -name "*.blockmap" ! -name "*-arm64*" -type f -delete

          echo "Files kept for ARM64 build:"
          ls -la *arm64* latest-mac.yml 2>/dev/null || echo "No ARM64 files or latest-mac.yml found"

          # Store the build directory for next step
          echo "BUILD_DIR=$BUILD_DIR" >> $GITHUB_ENV

      - name: Upload ARM64 artifacts to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.extract-version.outputs.release_tag }}
        run: |
          cd "$BUILD_DIR"

          echo "Using release tag: $RELEASE_TAG"

          # Check if draft release exists, create if not
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Draft release $RELEASE_TAG does not exist, creating it..."
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes "Release $RELEASE_TAG" --draft
          else
            echo "Found existing release: $RELEASE_TAG"
          fi

          # Upload ARM64 files and latest-mac.yml to the draft release
          uploaded=false
          for file in *arm64* latest-mac.yml; do
            if [[ -f "$file" ]]; then
              echo "Uploading file: $file to release $RELEASE_TAG"
              gh release upload "$RELEASE_TAG" "$file" --clobber
              uploaded=true
            fi
          done

          if [ "$uploaded" = false ]; then
            echo "Warning: No ARM64 files or latest-mac.yml found to upload"
            ls -la
          else
            echo "Upload completed. Checking release:"
            gh release view "$RELEASE_TAG"
          fi

  publish-mac-x64:
    runs-on: macos-13
    needs: extract-version
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: |
          npm install
          npm run postinstall

      - name: Build project
        run: npm run build

      - name: Build for macOS x64 (no publish yet)
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASS }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          npm exec electron-builder -- --publish never --mac --x64

      - name: Find and filter x64 artifacts
        run: |
          BUILD_DIR="release/build"

          echo "Using build directory: $BUILD_DIR"

          if [ ! -d "$BUILD_DIR" ]; then
            echo "Error: Build directory $BUILD_DIR not found"
            echo "Current directory contents:"
            ls -la
            echo "Searching for build artifacts..."
            find . -name "*.dmg" -o -name "*.zip" | head -10
            exit 1
          fi

          cd "$BUILD_DIR"
          echo "Build directory contents:"
          ls -la

          # Remove all ARM64 files (files containing -arm64)
          find . -name "*-arm64*" -type f -delete

          # Remove any other architecture-specific files that might exist
          find . -name "*.dmg" -name "*-x64*" -type f -delete

          echo "Files kept for x64 build:"
          ls -la *.dmg *.zip latest-mac.yml 2>/dev/null || echo "No files found"

          # Store the build directory for next step
          echo "BUILD_DIR=$BUILD_DIR" >> $GITHUB_ENV

      - name: Upload x64 artifacts to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.extract-version.outputs.release_tag }}
        run: |
          cd "$BUILD_DIR"

          echo "Using release tag: $RELEASE_TAG"

          # Check if draft release exists, create if not
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Draft release $RELEASE_TAG does not exist, creating it..."
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes "Release $RELEASE_TAG" --draft
          else
            echo "Found existing release: $RELEASE_TAG"
          fi

          # Upload x64 files and latest-mac.yml to the draft release
          uploaded=false
          for file in *.dmg *.zip latest-mac.yml; do
            if [[ -f "$file" ]] && [[ ! "$file" =~ arm64 ]]; then
              echo "Uploading file: $file to release $RELEASE_TAG"
              gh release upload "$RELEASE_TAG" "$file" --clobber
              uploaded=true
            fi
          done

          if [ "$uploaded" = false ]; then
            echo "Warning: No x64 files or latest-mac.yml found to upload"
            ls -la
          else
            echo "Upload completed. Checking release:"
            gh release view "$RELEASE_TAG"
          fi

  publish-windows:
    runs-on: windows-latest
    needs: extract-version
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: |
          npm install
          npm run postinstall

      - name: Build project
        run: npm run build

      - name: Build for Windows (no publish yet)
        run: |
          npm exec electron-builder -- --publish never --win

      - name: Upload Windows artifacts to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.extract-version.outputs.release_tag }}
        shell: bash
        run: |
          BUILD_DIR="release/build"

          if [ ! -d "$BUILD_DIR" ]; then
            echo "Error: Build directory $BUILD_DIR not found"
            echo "Current directory contents:"
            ls -la
            echo "Searching for build artifacts..."
            find . -name "*.exe" -o -name "*.msi" | head -10
            exit 1
          fi

          cd "$BUILD_DIR"
          echo "Build directory contents:"
          ls -la
          echo "Using release tag: $RELEASE_TAG"

          # Check if draft release exists, create if not
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Draft release $RELEASE_TAG does not exist, creating it..."
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes "Release $RELEASE_TAG" --draft
          else
            echo "Found existing release: $RELEASE_TAG"
          fi

          # Upload Windows files to the draft release
          uploaded=false
          for file in *.exe *.msi *.blockmap latest.yml; do
            if [[ -f "$file" ]]; then
              echo "Uploading Windows file: $file to release $RELEASE_TAG"
              gh release upload "$RELEASE_TAG" "$file" --clobber
              uploaded=true
            fi
          done

          if [ "$uploaded" = false ]; then
            echo "Warning: No Windows files found to upload"
            ls -la
          else
            echo "Upload completed. Checking release:"
            gh release view "$RELEASE_TAG"
          fi

  publish-linux:
    runs-on: ubuntu-latest
    needs: extract-version
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: |
          npm install
          npm run postinstall

      - name: Build project
        run: npm run build

      - name: Build for Linux (no publish yet)
        run: |
          npm exec electron-builder -- --publish never --linux deb rpm

      - name: Upload Linux artifacts to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.extract-version.outputs.release_tag }}
        run: |
          BUILD_DIR="release/build"

          if [ ! -d "$BUILD_DIR" ]; then
            echo "Error: Build directory $BUILD_DIR not found"
            echo "Current directory contents:"
            ls -la
            echo "Searching for build artifacts..."
            find . -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" | head -10
            exit 1
          fi

          cd "$BUILD_DIR"
          echo "Build directory contents:"
          ls -la
          echo "Using release tag: $RELEASE_TAG"

          # Check if draft release exists, create if not
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Draft release $RELEASE_TAG does not exist, creating it..."
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes "Release $RELEASE_TAG" --draft
          else
            echo "Found existing release: $RELEASE_TAG"
          fi

          # Upload Linux files to the draft release
          uploaded=false
          for file in *.deb *.rpm *.AppImage *.tar.gz latest-linux.yml; do
            if [[ -f "$file" ]]; then
              echo "Uploading Linux file: $file to release $RELEASE_TAG"
              gh release upload "$RELEASE_TAG" "$file" --clobber
              uploaded=true
            fi
          done

          if [ "$uploaded" = false ]; then
            echo "Warning: No Linux files found to upload"
            ls -la
          else
            echo "Upload completed. Checking release:"
            gh release view "$RELEASE_TAG"
          fi
