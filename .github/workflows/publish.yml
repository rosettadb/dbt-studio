  merge-mac-manifests:
    runs-on: ubuntu-latest
    needs: [extract-version, publish-mac-arm64, publish-mac-x64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Download architecture-specific manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.extract-version.outputs.release_tag }}
        run: |
          mkdir -p temp-manifests
          cd temp-manifests

          echo "Downloading manifests from release $RELEASE_TAG..."

          # Download both architecture-specific manifests
          gh release download "$RELEASE_TAG" -p "latest-mac-arm64.yml" || echo "ARM64 manifest not found"
          gh release download "$RELEASE_TAG" -p "latest-mac-x64.yml" || echo "x64 manifest not found"

          ls -la

      - name: Merge manifests into final latest-mac.yml
        run: |
          cd temp-manifests

          # Install js-yaml locally
          npm init -y
          npm install js-yaml

          # Create merge script
          cat > merge-manifests.js << 'EOF'
          const fs = require('fs');
          const yaml = require('js-yaml');

          const arm64Path = 'latest-mac-arm64.yml';
          const x64Path = 'latest-mac-x64.yml';

          let mergedManifest = null;
          let allFiles = [];

          // Read ARM64 manifest
          if (fs.existsSync(arm64Path)) {
            const arm64Manifest = yaml.load(fs.readFileSync(arm64Path, 'utf8'));
            mergedManifest = { ...arm64Manifest };
            if (arm64Manifest.files) {
              allFiles.push(...arm64Manifest.files);
              console.log(`Added ${arm64Manifest.files.length} ARM64 files`);
            }
          } else {
            console.log('ARM64 manifest not found');
          }

          // Read x64 manifest
          if (fs.existsSync(x64Path)) {
            const x64Manifest = yaml.load(fs.readFileSync(x64Path, 'utf8'));
            if (!mergedManifest) {
              mergedManifest = { ...x64Manifest };
            }
            if (x64Manifest.files) {
              allFiles.push(...x64Manifest.files);
              console.log(`Added ${x64Manifest.files.length} x64 files`);
            }
          } else {
            console.log('x64 manifest not found');
          }

          if (!mergedManifest) {
            console.error('No manifests found to merge!');
            process.exit(1);
          }

          // Set merged files
          mergedManifest.files = allFiles;

          // Set the main path to the first file (preferably ARM64 for Apple Silicon)
          if (allFiles.length > 0) {
            const arm64File = allFiles.find(f => f.url.includes('arm64'));
            if (arm64File) {
              mergedManifest.path = arm64File.url;
              mergedManifest.sha512 = arm64File.sha512;
            } else {
              mergedManifest.path = allFiles[0].url;
              mergedManifest.sha512 = allFiles[0].sha512;
            }
          }

          // Write merged manifest
          fs.writeFileSync('latest-mac.yml', yaml.dump(mergedManifest), 'utf8');
          console.log('✓ Merged manifest created with', allFiles.length, 'files');
          console.log('Main path:', mergedManifest.path);
          EOF

          # Run merge script
          node merge-manifests.js

          echo "Merged manifest contents:"
          cat latest-mac.yml

      - name: Upload merged latest-mac.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.extract-version.outputs.release_tag }}
        run: |
          cd temp-manifests

          echo "Uploading merged latest-mac.yml to release $RELEASE_TAG..."
          gh release upload "$RELEASE_TAG" latest-mac.yml --clobber

          echo "✓ Upload completed"
          gh release view "$RELEASE_TAG"
