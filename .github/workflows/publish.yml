name: Publish

on:
  push:
    branches:
      - main
      - release/dev
      - bugfix/workflow

env:
  # This will be set by the first job and used by all others
  RELEASE_TAG: ""

jobs:
  extract-version:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from package.json
        id: version
        run: |
          # Extract version from package.json
          VERSION=$(node -p "require('./package.json').version")
          echo "Extracted version: $VERSION"

          # Check if this is a pre-release version (contains alpha, beta, rc, etc.)
          SUFFIX=""
          if echo "$VERSION" | grep -q -E "(alpha|beta|rc)"; then
            # Extract the pre-release suffix
            if echo "$VERSION" | grep -q "alpha"; then
              SUFFIX="-alpha"
            elif echo "$VERSION" | grep -q "beta"; then
              SUFFIX="-beta"
            elif echo "$VERSION" | grep -q "rc"; then
              SUFFIX="-rc"
            fi
            # Remove the suffix from version for cleaner tag
            CLEAN_VERSION=$(echo "$VERSION" | sed -E 's/-(alpha|beta|rc).*//')
          else
            CLEAN_VERSION="$VERSION"
          fi

          RELEASE_TAG="${CLEAN_VERSION}${SUFFIX}"
          echo "Release tag: $RELEASE_TAG"

          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
  publish-mac-arm64:
    runs-on: macos-latest
    needs: extract-version
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: |
          npm install
          npm run postinstall

      - name: Verify native binaries (ARM64)
        run: |
          echo "=== Verifying native module binaries for ARM64 ==="

          # Check DuckDB bindings
          echo "DuckDB bindings:"
          ls -la release/app/node_modules/@duckdb/ 2>/dev/null || echo "DuckDB not found at expected location"

          # Check if ARM64 DuckDB binding is present
          if [ -d "release/app/node_modules/@duckdb/node-bindings-darwin-arm64" ]; then
            echo "✓ DuckDB ARM64 binding found"
          else
            echo "⚠ DuckDB ARM64 binding not found, forcing installation..."
            cd release/app && npm install @duckdb/node-bindings-darwin-arm64@1.3.0-alpha.21 && cd ../..
          fi

          # Check better-sqlite3 bindings
          echo "better-sqlite3 bindings:"
          find release/app/node_modules/better-sqlite3 -name "*.node" 2>/dev/null || echo "No .node files found"

          # Check keytar bindings
          echo "keytar bindings:"
          find release/app/node_modules/keytar -name "*.node" 2>/dev/null || echo "No .node files found"

          echo "=== Verification complete ==="

      - name: Build project
        run: npm run build

      - name: Build for macOS ARM64 (no publish yet)
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASS }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          npm exec electron-builder -- --publish never --mac --arm64

      - name: Find and filter ARM64 artifacts
        run: |
          BUILD_DIR="release/build"

          echo "Using build directory: $BUILD_DIR"

          if [ ! -d "$BUILD_DIR" ]; then
            echo "Error: Build directory $BUILD_DIR not found"
            echo "Current directory contents:"
            ls -la
            echo "Searching for build artifacts..."
            find . -name "*.dmg" -o -name "*.zip" | head -10
            exit 1
          fi

          cd "$BUILD_DIR"
          echo "Build directory contents:"
          ls -la

          # Remove all x64 files (files containing -x64), but keep ARM64 files
          find . -name "*-x64*" -type f -delete

          echo "Files kept for ARM64 build:"
          ls -la *arm64* latest-mac.yml 2>/dev/null || echo "No ARM64 files or latest-mac.yml found"

          # Store the build directory for next step
          echo "BUILD_DIR=$BUILD_DIR" >> $GITHUB_ENV

      - name: Recalculate hashes for latest-mac.yml
        run: |
          cd "$BUILD_DIR"

          if [ ! -f "latest-mac.yml" ]; then
            echo "No latest-mac.yml found, skipping hash update"
            exit 0
          fi

          echo "Recalculating hashes for macOS ARM64 artifacts..."

          # Install js-yaml for YAML manipulation
          npm install -g js-yaml

          # Create a Node.js script inline to update the YAML
          cat > update-manifest.js << 'EOF'
          const fs = require('fs');
          const crypto = require('crypto');
          const yaml = require('js-yaml');
          const path = require('path');

          function calculateSHA512(filePath) {
            const fileBuffer = fs.readFileSync(filePath);
            const hashSum = crypto.createHash('sha512');
            hashSum.update(fileBuffer);
            return hashSum.digest('base64');
          }

          const manifestPath = 'latest-mac.yml';

          if (!fs.existsSync(manifestPath)) {
            console.log('Manifest not found');
            process.exit(0);
          }

          const manifest = yaml.load(fs.readFileSync(manifestPath, 'utf8'));

          console.log('Updating manifest...');

          // Filter and update only files that actually exist
          if (manifest.files) {
            manifest.files = manifest.files
              .filter(file => {
                const exists = fs.existsSync(file.url);
                if (!exists) {
                  console.log(`  Removing ${file.url} (file not found)`);
                }
                return exists;
              })
              .map(file => {
                const filePath = file.url;
                const newHash = calculateSHA512(filePath);
                const newSize = fs.statSync(filePath).size;
                console.log(`  Updated ${file.url}: size=${newSize}`);
                return {
                  ...file,
                  sha512: newHash,
                  size: newSize
                };
              });
          }

          // Update top-level path/sha512 if present
          if (manifest.path) {
            if (fs.existsSync(manifest.path)) {
              manifest.sha512 = calculateSHA512(manifest.path);
              console.log(`  Updated main path: ${manifest.path}`);
            } else {
              // If the main path doesn't exist, find the first available file
              if (manifest.files && manifest.files.length > 0) {
                manifest.path = manifest.files[0].url;
                manifest.sha512 = manifest.files[0].sha512;
                console.log(`  Updated main path to: ${manifest.path}`);
              }
            }
          }

          fs.writeFileSync(manifestPath, yaml.dump(manifest), 'utf8');
          console.log('✓ Manifest updated successfully');
          EOF

          # Run the update script
          node update-manifest.js

          # Clean up
          rm update-manifest.js

          echo "Hash recalculation completed"

      - name: Rename manifest to architecture-specific name
        run: |
          cd "$BUILD_DIR"
          if [ -f "latest-mac.yml" ]; then
            mv latest-mac.yml latest-mac-arm64.yml
            echo "Renamed latest-mac.yml to latest-mac-arm64.yml"
          fi

      - name: Upload ARM64 artifacts to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.extract-version.outputs.release_tag }}
        run: |
          cd "$BUILD_DIR"

          echo "Using release tag: $RELEASE_TAG"

          # Check if draft release exists, create if not
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Draft release $RELEASE_TAG does not exist, creating it..."
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes "Release $RELEASE_TAG" --draft
          else
            echo "Found existing release: $RELEASE_TAG"
          fi

          # Upload ARM64 files and architecture-specific manifest
          uploaded=false
          for file in *arm64*; do
            if [[ -f "$file" ]]; then
              echo "Uploading file: $file to release $RELEASE_TAG"
              gh release upload "$RELEASE_TAG" "$file" --clobber
              uploaded=true
            fi
          done

          if [ "$uploaded" = false ]; then
            echo "Warning: No ARM64 files found to upload"
            ls -la
          else
            echo "Upload completed. Checking release:"
            gh release view "$RELEASE_TAG"
          fi

  publish-mac-x64:
    runs-on: macos-latest
    needs: extract-version
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js (x86_64)
        run: |
          # Download and install x86_64 version of Node.js
          curl -fsSL https://nodejs.org/dist/v18.20.5/node-v18.20.5-darwin-x64.tar.gz -o node-x64.tar.gz
          mkdir -p $HOME/node-x64
          tar -xzf node-x64.tar.gz -C $HOME/node-x64 --strip-components=1
          echo "$HOME/node-x64/bin" >> $GITHUB_PATH

      - name: Verify x86_64 Node.js
        run: |
          export PATH="$HOME/node-x64/bin:$PATH"
          echo "Node.js architecture:"
          arch -x86_64 node -p "process.arch"
          echo "Node.js version:"
          arch -x86_64 node -v
          echo "npm version:"
          arch -x86_64 npm -v

      - name: Install dependencies (x86_64)
        run: |
          export PATH="$HOME/node-x64/bin:$PATH"
          # Install dependencies under x86_64 architecture
          # This ensures prebuild-install downloads x64 binaries
          arch -x86_64 npm install
          arch -x86_64 npm run postinstall

      - name: Verify native binaries (x86_64)
        run: |
          export PATH="$HOME/node-x64/bin:$PATH"
          echo "=== Verifying native module binaries for x86_64 ==="

          # Check DuckDB bindings
          echo "DuckDB bindings:"
          ls -la release/app/node_modules/@duckdb/ 2>/dev/null || echo "DuckDB not found at expected location"

          # Check if x64 DuckDB binding is present
          if [ -d "release/app/node_modules/@duckdb/node-bindings-darwin-x64" ]; then
            echo "✓ DuckDB x64 binding found"
          else
            echo "⚠ DuckDB x64 binding not found, forcing installation..."
            cd release/app && arch -x86_64 npm install @duckdb/node-bindings-darwin-x64@1.3.0-alpha.21 && cd ../..
          fi

          # Check better-sqlite3 bindings
          echo "better-sqlite3 bindings:"
          find release/app/node_modules/better-sqlite3 -name "*.node" 2>/dev/null || echo "No .node files found"

          # Check keytar bindings
          echo "keytar bindings:"
          find release/app/node_modules/keytar -name "*.node" 2>/dev/null || echo "No .node files found"

          echo "=== Verification complete ==="

      - name: Build project (x86_64)
        run: |
          export PATH="$HOME/node-x64/bin:$PATH"
          arch -x86_64 npm run build

      - name: Build for macOS x64 (no publish yet)
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASS }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          export PATH="$HOME/node-x64/bin:$PATH"
          arch -x86_64 npm exec electron-builder -- --publish never --mac --x64

      - name: Find and filter x64 artifacts
        run: |
          BUILD_DIR="release/build"

          echo "Using build directory: $BUILD_DIR"

          if [ ! -d "$BUILD_DIR" ]; then
            echo "Error: Build directory $BUILD_DIR not found"
            echo "Current directory contents:"
            ls -la
            echo "Searching for build artifacts..."
            find . -name "*.dmg" -o -name "*.zip" | head -10
            exit 1
          fi

          cd "$BUILD_DIR"
          echo "Build directory contents:"
          ls -la

          # Remove all ARM64 files (files containing -arm64), but keep x64 files
          find . -name "*-arm64*" -type f -delete

          echo "Files kept for x64 build:"
          ls -la *x64* latest-mac.yml 2>/dev/null || echo "No x64 files or latest-mac.yml found"

          # Store the build directory for next step
          echo "BUILD_DIR=$BUILD_DIR" >> $GITHUB_ENV

      - name: Recalculate hashes for latest-mac.yml
        run: |
          export PATH="$HOME/node-x64/bin:$PATH"
          cd "$BUILD_DIR"

          if [ ! -f "latest-mac.yml" ]; then
            echo "No latest-mac.yml found, skipping hash update"
            exit 0
          fi

          echo "Recalculating hashes for macOS x64 artifacts..."

          # Install js-yaml for YAML manipulation
          arch -x86_64 npm install -g js-yaml

          # Create a Node.js script inline to update the YAML
          cat > update-manifest.js << 'EOF'
          const fs = require('fs');
          const crypto = require('crypto');
          const yaml = require('js-yaml');
          const path = require('path');

          function calculateSHA512(filePath) {
            const fileBuffer = fs.readFileSync(filePath);
            const hashSum = crypto.createHash('sha512');
            hashSum.update(fileBuffer);
            return hashSum.digest('base64');
          }

          const manifestPath = 'latest-mac.yml';

          if (!fs.existsSync(manifestPath)) {
            console.log('Manifest not found');
            process.exit(0);
          }

          const manifest = yaml.load(fs.readFileSync(manifestPath, 'utf8'));

          console.log('Updating manifest...');

          // Filter and update only files that actually exist
          if (manifest.files) {
            manifest.files = manifest.files
              .filter(file => {
                const exists = fs.existsSync(file.url);
                if (!exists) {
                  console.log(`  Removing ${file.url} (file not found)`);
                }
                return exists;
              })
              .map(file => {
                const filePath = file.url;
                const newHash = calculateSHA512(filePath);
                const newSize = fs.statSync(filePath).size;
                console.log(`  Updated ${file.url}: size=${newSize}`);
                return {
                  ...file,
                  sha512: newHash,
                  size: newSize
                };
              });
          }

          // Update top-level path/sha512 if present
          if (manifest.path) {
            if (fs.existsSync(manifest.path)) {
              manifest.sha512 = calculateSHA512(manifest.path);
              console.log(`  Updated main path: ${manifest.path}`);
            } else {
              // If the main path doesn't exist, find the first available file
              if (manifest.files && manifest.files.length > 0) {
                manifest.path = manifest.files[0].url;
                manifest.sha512 = manifest.files[0].sha512;
                console.log(`  Updated main path to: ${manifest.path}`);
              }
            }
          }

          fs.writeFileSync(manifestPath, yaml.dump(manifest), 'utf8');
          console.log('✓ Manifest updated successfully');
          EOF

          # Run the update script
          arch -x86_64 node update-manifest.js

          # Clean up
          rm update-manifest.js

          echo "Hash recalculation completed"

      - name: Rename manifest to architecture-specific name
        run: |
          cd "$BUILD_DIR"
          if [ -f "latest-mac.yml" ]; then
            mv latest-mac.yml latest-mac-x64.yml
            echo "Renamed latest-mac.yml to latest-mac-x64.yml"
          fi

      - name: Upload x64 artifacts to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.extract-version.outputs.release_tag }}
        run: |
          cd "$BUILD_DIR"

          echo "Using release tag: $RELEASE_TAG"

          # Check if draft release exists, create if not
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Draft release $RELEASE_TAG does not exist, creating it..."
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes "Release $RELEASE_TAG" --draft
          else
            echo "Found existing release: $RELEASE_TAG"
          fi

          # Upload x64 files and architecture-specific manifest
          uploaded=false
          for file in *x64*; do
            if [[ -f "$file" ]]; then
              echo "Uploading file: $file to release $RELEASE_TAG"
              gh release upload "$RELEASE_TAG" "$file" --clobber
              uploaded=true
            fi
          done

          # Upload the x64 manifest
          if [[ -f "latest-mac-x64.yml" ]]; then
            echo "Uploading manifest: latest-mac-x64.yml to release $RELEASE_TAG"
            gh release upload "$RELEASE_TAG" "latest-mac-x64.yml" --clobber
          fi

          if [ "$uploaded" = false ]; then
            echo "Warning: No x64 files found to upload"
            ls -la
          else
            echo "Upload completed. Checking release:"
            gh release view "$RELEASE_TAG"
          fi

  publish-windows:
    runs-on: windows-latest
    needs: extract-version
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: |
          npm install
          npm run postinstall

      - name: Build project
        run: npm run build

      - name: Build for Windows (no publish yet)
        run: |
          npm exec electron-builder -- --publish never --win

      - name: Sign Windows artifacts with Azure Trusted Signing
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: release/build
          files-folder-filter: exe,msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Recalculate hashes for latest.yml after signing
        shell: bash
        run: |
          BUILD_DIR="release/build"
          cd "$BUILD_DIR"

          if [ ! -f "latest.yml" ]; then
            echo "No latest.yml found, skipping hash update"
            exit 0
          fi

          echo "Recalculating hashes for Windows artifacts after signing..."

          # Install js-yaml for YAML manipulation
          npm install -g js-yaml

          # Create a Node.js script inline to update the YAML
          cat > update-manifest.js << 'EOF'
          const fs = require('fs');
          const crypto = require('crypto');
          const yaml = require('js-yaml');
          const path = require('path');

          function calculateSHA512(filePath) {
            const fileBuffer = fs.readFileSync(filePath);
            const hashSum = crypto.createHash('sha512');
            hashSum.update(fileBuffer);
            return hashSum.digest('base64');
          }

          const manifestPath = 'latest.yml';

          if (!fs.existsSync(manifestPath)) {
            console.log('Manifest not found');
            process.exit(0);
          }

          const manifest = yaml.load(fs.readFileSync(manifestPath, 'utf8'));

          console.log('Updating manifest...');

          // Update files array
          if (manifest.files) {
            manifest.files = manifest.files.map(file => {
              const filePath = file.url;
              if (fs.existsSync(filePath)) {
                const newHash = calculateSHA512(filePath);
                const newSize = fs.statSync(filePath).size;
                console.log(`  Updated ${file.url}: size=${newSize}`);
                return {
                  ...file,
                  sha512: newHash,
                  size: newSize
                };
              }
              return file;
            });
          }

          // Update top-level path/sha512 if present
          if (manifest.path && fs.existsSync(manifest.path)) {
            manifest.sha512 = calculateSHA512(manifest.path);
            console.log(`  Updated main path: ${manifest.path}`);
          }

          fs.writeFileSync(manifestPath, yaml.dump(manifest), 'utf8');
          console.log('✓ Manifest updated successfully');
          EOF

          # Run the update script
          node update-manifest.js

          # Clean up
          rm update-manifest.js

          echo "Hash recalculation completed"

      - name: Upload Windows artifacts to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.extract-version.outputs.release_tag }}
        shell: bash
        run: |
          BUILD_DIR="release/build"

          if [ ! -d "$BUILD_DIR" ]; then
            echo "Error: Build directory $BUILD_DIR not found"
            echo "Current directory contents:"
            ls -la
            echo "Searching for build artifacts..."
            find . -name "*.exe" -o -name "*.msi" | head -10
            exit 1
          fi

          cd "$BUILD_DIR"
          echo "Build directory contents:"
          ls -la
          echo "Using release tag: $RELEASE_TAG"

          # Check if draft release exists, create if not
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Draft release $RELEASE_TAG does not exist, creating it..."
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes "Release $RELEASE_TAG" --draft
          else
            echo "Found existing release: $RELEASE_TAG"
          fi

          # Upload Windows files to the draft release
          uploaded=false
          for file in *.exe *.msi *.blockmap latest.yml; do
            if [[ -f "$file" ]]; then
              echo "Uploading Windows file: $file to release $RELEASE_TAG"
              gh release upload "$RELEASE_TAG" "$file" --clobber
              uploaded=true
            fi
          done

          if [ "$uploaded" = false ]; then
            echo "Warning: No Windows files found to upload"
            ls -la
          else
            echo "Upload completed. Checking release:"
            gh release view "$RELEASE_TAG"
          fi

  publish-linux:
