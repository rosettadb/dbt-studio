name: Test

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate source branch
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "Test workflow update"
            echo "❌ Error: Pull requests to main can only be created from dev branch"
            exit 1
          fi
          echo "✅ Source branch validation passed"

  test:
    runs-on: macos-latest
    needs: validate
    if: github.head_ref == 'dev'

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3

      - name: Install Node.js and NPM
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: npm

      - name: npm install
        run: |
          npm install

      - name: npm build
        run: |
          npm run lint
          npm exec tsc
