name: PR Checks

# Lint, type check, and unit tests for every pull request to dev.
# Dependencies are installed with --ignore-scripts, so no package install
# script (native builds, postinstall hooks) runs in CI. Native modules that
# tests need are mocked in tests/unit/__setup__/.

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-checks:
    name: PR Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            release/app/package-lock.json

      - name: Install dependencies (no install scripts)
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix release/app

      - name: Link app modules
        # The same step postinstall runs: symlink src/node_modules and
        # .erb/node_modules to release/app/node_modules.
        run: npx ts-node --transpile-only .erb/scripts/link-modules.ts

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --ci
        env:
          CI: true
