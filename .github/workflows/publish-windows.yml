name: Test Azure Code Signing

on:
  workflow_dispatch:  # Manual trigger only
  push:
    branches:
      - test-signing  # Only runs on test-signing branch

jobs:
  test-signing:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create dummy executable for testing
        shell: pwsh
        run: |
          Write-Host "Creating test directory..."
          New-Item -ItemType Directory -Force -Path "test-build"

          # Create a dummy .exe file (just copy cmd.exe as a test file)
          Write-Host "Creating dummy executable..."
          Copy-Item "C:\Windows\System32\cmd.exe" -Destination "test-build\DummyApp.exe"

          if (Test-Path "test-build\DummyApp.exe") {
            Write-Host "✓ Dummy executable created successfully!" -ForegroundColor Green
            Write-Host "File size: $((Get-Item 'test-build\DummyApp.exe').Length) bytes"
          } else {
            Write-Error "Failed to create dummy executable"
            exit 1
          }

      - name: Verify unsigned executable
        shell: pwsh
        run: |
          Write-Host "Checking signature status of dummy file..."
          $signature = Get-AuthenticodeSignature -FilePath "test-build\DummyApp.exe"
          Write-Host "Status: $($signature.Status)"
          Write-Host "Status Message: $($signature.StatusMessage)"

      - name: Sign test executable with Azure Trusted Signing
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: test-build
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signed executable
        shell: pwsh
        run: |
          Write-Host "`n========================================" -ForegroundColor Cyan
          Write-Host "SIGNATURE VERIFICATION" -ForegroundColor Cyan
          Write-Host "========================================`n" -ForegroundColor Cyan

          $signature = Get-AuthenticodeSignature -FilePath "test-build\DummyApp.exe"

          Write-Host "Status: $($signature.Status)" -ForegroundColor $(if ($signature.Status -eq "Valid") { "Green" } else { "Red" })
          Write-Host "Status Message: $($signature.StatusMessage)"
          Write-Host "Signer Certificate:"
          Write-Host "  Subject: $($signature.SignerCertificate.Subject)"
          Write-Host "  Issuer: $($signature.SignerCertificate.Issuer)"
          Write-Host "  Thumbprint: $($signature.SignerCertificate.Thumbprint)"
          Write-Host "  Valid From: $($signature.SignerCertificate.NotBefore)"
          Write-Host "  Valid Until: $($signature.SignerCertificate.NotAfter)"

          if ($signature.TimeStamperCertificate) {
            Write-Host "`nTimestamp Certificate:"
            Write-Host "  Subject: $($signature.TimeStamperCertificate.Subject)"
            Write-Host "  Thumbprint: $($signature.TimeStamperCertificate.Thumbprint)"
          }

          Write-Host "`n========================================`n" -ForegroundColor Cyan

          if ($signature.Status -eq "Valid") {
            Write-Host "✓ SUCCESS: Executable is properly signed!" -ForegroundColor Green
          } else {
            Write-Error "✗ FAILED: Signature is not valid!"
            exit 1
          }

      - name: Upload signed test executable as artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-test-executable
          path: test-build/DummyApp.exe
          retention-days: 7

      - name: Test Summary
        shell: pwsh
        run: |
          Write-Host "`n" -NoNewline
          Write-Host "╔══════════════════════════════════════════════════╗" -ForegroundColor Green
          Write-Host "║                                                  ║" -ForegroundColor Green
          Write-Host "║  ✓ Azure Code Signing Test PASSED!              ║" -ForegroundColor Green
          Write-Host "║                                                  ║" -ForegroundColor Green
          Write-Host "║  The signed executable has been uploaded as      ║" -ForegroundColor Green
          Write-Host "║  an artifact. You can download it to verify     ║" -ForegroundColor Green
          Write-Host "║  the signature on your local machine.           ║" -ForegroundColor Green
          Write-Host "║                                                  ║" -ForegroundColor Green
          Write-Host "╚══════════════════════════════════════════════════╝" -ForegroundColor Green
          Write-Host "`n"
