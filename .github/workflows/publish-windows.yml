name: Publish Windows

on:
  push:
    branches:
      - release/windows

jobs:
  extract-version:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from package.json
        id: version
        run: |
          # Extract version from package.json
          VERSION=$(node -p "require('./package.json').version")
          echo "Extracted version: $VERSION"

          # Check if this is a pre-release version (contains alpha, beta, rc, etc.)
          SUFFIX=""
          if echo "$VERSION" | grep -q -E "(alpha|beta|rc)"; then
            # Extract the pre-release suffix
            if echo "$VERSION" | grep -q "alpha"; then
              SUFFIX="-alpha"
            elif echo "$VERSION" | grep -q "beta"; then
              SUFFIX="-beta"
            elif echo "$VERSION" | grep -q "rc"; then
              SUFFIX="-rc"
            fi
            # Remove the suffix from version for cleaner tag
            CLEAN_VERSION=$(echo "$VERSION" | sed -E 's/-(alpha|beta|rc).*//')
          else
            CLEAN_VERSION="$VERSION"
          fi

          RELEASE_TAG="${CLEAN_VERSION}${SUFFIX}"
          echo "Release tag: $RELEASE_TAG"

          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  publish-windows:
    runs-on: windows-latest
    needs: extract-version
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

#      - name: Install Node.js
#        uses: actions/setup-node@v4
#        with:
#          node-version: 18
#          cache: npm
#
#      - name: Install dependencies
#        run: |
#          npm install
#          npm run postinstall
#
#      - name: Build project
#        run: npm run build

      - name: Setup Azure Trusted Signing
        shell: pwsh
        run: |
          Write-Host "Installing Azure Trusted Signing CLI..."
          dotnet tool install --global Microsoft.Trusted.Signing.Client --version 1.0.60

          # Add .NET global tools to PATH for this session
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          Write-Host "PATH updated: $env:PATH"

          # Verify installation
          trusted-signing --version

          # Create credentials and metadata files
          Write-Host "Creating credentials file..."
          '${{ secrets.AZURE_SIGNING_CREDS }}' | Out-File -FilePath sp-creds.json -Encoding UTF8

          Write-Host "Creating metadata file..."
          '${{ secrets.AZURE_SIGNING_METADATA }}' | Out-File -FilePath metadata.json -Encoding UTF8

      - name: Test Azure Trusted Signing on small file
        shell: pwsh
        run: |
          Write-Host "Creating a small test file to sign..."
          New-Item -Path "test.exe" -ItemType File -Value "dummy content" | Out-Null

          Write-Host "Loading Azure signing configuration..."
          $metadata = Get-Content -Raw -Path "metadata.json" | ConvertFrom-Json

          Write-Host "Testing sign command..."
          trusted-signing sign `
            -e $metadata.Endpoint `
            -a $metadata.CodeSigningAccountName `
            -c $metadata.CertificateProfileName `
            -cj "sp-creds.json" `
            -fd SHA256 `
            -tr "http://timestamp.acs.microsoft.com" `
            -td SHA256 `
            -v Debug `
            "test.exe"

          if ($LASTEXITCODE -eq 0) {
            Write-Host "✅ Test signing succeeded!"
          } else {
            Write-Error "❌ Test signing failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          Write-Host "Verifying signed file..."
          dir test.exe


