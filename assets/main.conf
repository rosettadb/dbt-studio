; Rosetta main configuration file
; This file will be populated when you configure a database connection
;
; Example structure:
; connections:
;   - name: your_project_name
;     databaseName: your_database
;     schemaName: your_schema
;     dbType: postgres|snowflake|bigquery|redshift|databricks|duckdb
;     url: jdbc_connection_url
;     userName: ${db-user-connection_name}
;     password: ${db-password-connection_name}
